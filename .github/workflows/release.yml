name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write     # create the GitHub release
      id-token: write     # sign the build provenance attestation
      attestations: write # store it
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Check the tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not a semantic version (vX.Y.Z)"
            exit 1
          fi
          scripts/release-notes.sh "$GITHUB_REF_NAME" > release-notes.md
      - name: Install dbus-daemon
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dbus
      - name: Test
        env:
          BTCTL_REQUIRE_DBUS: "1"
        run: go test -race ./...
      - name: Build
        run: scripts/build-release.sh "$GITHUB_REF_NAME"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS \
            --verify-tag \
            --title "btctl $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            "${prerelease[@]}"
