name: Feature request
description: Suggest something btctl should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task or setup this is about, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you imagine btctl supporting it (a command, a menu entry, a flag, ...).
